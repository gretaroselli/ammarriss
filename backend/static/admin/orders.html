<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Amarri's Kitchen</title>
    <link href="/static/admin/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <div class="position-fixed top-0 start-0 bottom-0 d-flex flex-column align-items-center pt-4 px-3 text-white"
        style="width: 260px; background-color: #110d26; z-index: 1030;">

        <ul class="nav flex-column text-center w-100">
            <img src="/static/images/logo_ak.jpg" alt="Amarri's Kitchen Logo" class="rounded-circle d-block mx-auto mb-2"
                style="width: 80px; height: 80px; object-fit: cover; border: 2px solid #ffffff;">
            <h6 class="mt-2 mb-4 text-white fw-bold">Amarri's Kitchen</h6>

            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light"
                    href="/static/admin/dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link bg-warning text-white fw-bold rounded-pill py-2 px-3 shadow-sm" href="/static/admin/orders.html">Orders</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/reports.html">Report</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/transactions.html">Transaction
                    History</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/menu.html">Menu Management</a>
            </li>
        </ul>

        <div class="mt-auto w-100 mb-4">
            <hr class="text-white-50 my-4">
            <div class="card border-0 text-white mb-3 bg-white bg-opacity-10">
                <div class="card-body p-3">
                    <h5 class="card-title mb-1 fw-bold" id="user-name"></h5>
                    <p class="card-text small mb-1 text-white-50" id="user-role"></p>
                </div>
            </div>
            <a class="btn btn-outline-light w-100 border-white border-opacity-25 py-2" href="#" role="button"
                onclick="handleSignOut()">Sign
                Out</a>
        </div>
    </div>


    <main style="margin-left: 260px;">
        <div class="container-fluid py-4 px-4 min-vh-100 bg-light">

            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="fw-bold mb-1">Orders</h1>

                </div>
                <span class="btn btn-sm bg-white text-dark border p-2 shadow-sm fs-6 fw-normal rounded-pill"
                    onclick="window.location.reload()">Reload</span>
            </div>

            <div class="d-flex flex-wrap gap-2 mb-3 px-3 align-items-center" id="order-filters">
                <button class="btn btn-sm btn-success rounded-pill px-2 filter-btn active" onclick="highlightButton(this);filterAll()">All</button>
                <button class="btn btn-sm btn-outline-secondary text-dark rounded-pill px-2 filter-btn"
                     onclick="highlightButton(this);filterPending()">Pending</button>
                <button class="btn btn-sm btn-outline-secondary text-dark rounded-pill px-2 filter-btn"
                     onclick="highlightButton(this);filterCompleted()">Completed</button>
                <button class="btn btn-sm btn-outline-secondary text-dark rounded-pill px-2 filter-btn"
                    onclick="highlightButton(this);filterCancelled(this)">Cancelled</button>
            </div>

            <div class="row g-3 mb-3" id="orders-cards-container">
                <div class="col-12">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <div class="card-body p-2">

                            <div class="row align-items-center">

                                <div class="col-7 col-sm-8">
                                    <h6 class="text-danger fs-3 fw-extrabold mb-0" id="order-id">61</h6>
                                    <h2 class="mb-0 fs-5 my-1" id="order-items">Rice - Tonkatsu</h2>
                                    <small class="text-muted fw-semibold d-block" id="order-date">Today</small>
                                </div>

                                <div class="col-5 col-sm-4 text-end">
                                    <h2 class="fw-bold mb-2 fs-4" id="order-price">P1000</h2>
                                    <h2 class="text-success fs-6">Completed</h2>
                                    <button type="button"
                                        class="btn btn-sm btn-warning text-dark fw-bold rounded-pill px-3 shadow-sm"
                                        id="edit-order-btn">
                                        Edit
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

            
    </main>

    <script src="/static/admin/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin/orders.js"></script>
    <script src="/static/admin/shared.js"></script>
    <script>
        addEventListener("DOMContentLoaded", (event) => { filterAll() })
        addEventListener("DOMContentLoaded", (event) => { setSidebarUserInfo()})
    </script>
</body>

</html>
