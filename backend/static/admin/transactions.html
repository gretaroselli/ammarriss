<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Amarri's Kitchen</title>
    <link href="/static/admin/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body style="display:none">

    <div class="position-fixed top-0 start-0 bottom-0 d-flex flex-column align-items-center pt-4 px-3 text-white"
        style="width: 260px; background-color: #110d26; z-index: 1030;">

        <ul class="nav flex-column text-center w-100">
            <img src="/static/images/logo_ak.jpg" alt="Amarri's Kitchen Logo"
                class="rounded-circle d-block mx-auto mb-2"
                style="width: 80px; height: 80px; object-fit: cover; border: 2px solid #ffffff;">
            <h6 class="mt-2 mb-4 text-white fw-bold">Amarri's Kitchen</h6>

            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light"
                    href="/static/admin/dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light"
                    href="/static/admin/orders.html">Orders</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light"
                    href="/static/admin/reports.html">Report</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link bg-warning text-white fw-bold rounded-pill py-2 px-3 shadow-sm"
                    href="/static/admin/transactions.html">Transaction
                    History</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/menu.html">Menu
                    Management</a>
            </li>
        </ul>

        <div class="mt-auto w-100 mb-4">
            <hr class="text-white-50 my-4">
            <div class="card border-0 text-white mb-3 bg-white bg-opacity-10">
                <div class="card-body p-3">
                    <h5 class="card-title mb-1 fw-bold" id="user-name"></h5>
                    <p class="card-text small mb-1 text-white-50" id="user-role"></p>
                </div>
            </div>
            <a class="btn btn-outline-light w-100 border-white border-opacity-25 py-2" href="#" role="button"
                onclick="handleSignOut()">Sign
                Out</a>
        </div>
    </div>


    <main style="margin-left: 260px;">
        <div class="container-fluid py-4 px-4 min-vh-100 bg-light">

            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="fw-bold mb-1">Transaction History</h1>

                </div>
                <span class="btn btn-sm bg-white text-dark border p-2 shadow-sm fs-6 fw-normal rounded-pill"
                    onclick="window.location.reload()">Reload</span>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-12 col-md-6 col-lg-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search queue no. or item...">
                </div>
                <div class="col-6 col-md-3 col-lg-2">
                    <select class="form-select" id="typeFilter">
                        <option value="">All Types</option>
                        <option value="Dine-in">Dine-in</option>
                        <option value="Takeout">Takeout</option>
                    </select>
                </div>
                <div class="col-6 col-md-3 col-lg-2">
                    <select class="form-select" id="paymentFilter">
                        <option value="">All Payments</option>
                        <option value="Cash">Cash</option>
                        <option value="GCash">GCash</option>
                    </select>
                </div>
            </div>
            
            <div class="row g-2 mb-4">
                <div class="col-12 col-md-8 col-lg-6 d-flex gap-2">
                    <input type="date" class="form-control" id="dateFrom">
                    <input type="date" class="form-control" id="dateTo">
                    <button class="btn btn-outline-danger" onclick="clearDates()">Clear</button>
                </div>
            </div>
            
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Order No.</th>
                                <th>Date & Time</th>
                                <th>Type</th>
                                <th>Payment</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                        </tbody>
                    </table>
                </div>
            </div>

            
        </div>
    </main>

    <script src="/static/admin/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin/transactions.js"></script>
    <script src="/static/admin/shared.js"></script>
    <script>
        addEventListener("DOMContentLoaded", (event) => { authenticate() })
        addEventListener("DOMContentLoaded", (event) => { setSidebarUserInfo() })
        // addEventListener("DOMContentLoaded", (event) => { loadTransactions() })

    </script>
</body>

</html>
