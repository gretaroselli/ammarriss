<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Amarri's Kitchen</title>
    <link href="/static/admin/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body style="display:none">

    <div class="position-fixed top-0 start-0 bottom-0 d-flex flex-column align-items-center pt-4 px-3 text-white"
        style="width: 260px; background-color: #110d26; z-index: 1030;">

        <ul class="nav flex-column text-center w-100">
            <img src="/static/images/logo_ak.jpg" alt="Amarri's Kitchen Logo" class="rounded-circle d-block mx-auto mb-2"
                style="width: 80px; height: 80px; object-fit: cover; border: 2px solid #ffffff;">
            <h6 class="mt-2 mb-4 text-white fw-bold">Amarri's Kitchen</h6>

            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/orders.html">Orders</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light"
                    href="reports.html">Report</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/transactions.html">Transaction
                    History</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link bg-warning text-white fw-bold rounded-pill py-2 px-3 shadow-sm" href="/static/admin/menu.html">Menu Management</a>
            </li>
        </ul>

        <div class="mt-auto w-100 mb-4">
            <hr class="text-white-50 my-4">
            <div class="card border-0 text-white mb-3 bg-white bg-opacity-10">
                <div class="card-body p-3">
                    <h5 class="card-title mb-1 fw-bold" id="user-name"></h5>
                    <p class="card-text small mb-1 text-white-50" id="user-role"></p>
                </div>
            </div>
            <a class="btn btn-outline-light w-100 border-white border-opacity-25 py-2" href="#" role="button"
                onclick="handleSignOut()">Sign
                Out</a>
        </div>
    </div>


    <main style="margin-left: 260px;">
        <div class="container-fluid py-4 px-4 min-vh-100 bg-light">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="fw-bold mb-1">Menu Management</h1>
            
                </div>
                <span class="btn btn-sm bg-white text-dark border p-2 shadow-sm fs-6 fw-normal rounded-pill"
                    onclick="window.location.reload()">Reload</span>
            </div>


            <div class="row g-4">
            

                <div class="col-md-4 col-lg-3">
                    <h5 class="fw-bold mb-3">Categories</h5>
            

                    <div class="list-group shadow-sm border-0 mb-3" id="categories-container">

                    </div>
            

                    <div class="input-group shadow-sm rounded-pill bg-white border px-2 py-1">
                        <button class="btn btn-warning text-white rounded-pill px-3 d-inline-flex align-items-center gap-1" onclick="triggerAddCategory()">
                            <img src="/static/admin/bootstrap/plus.svg" width="16" height="16" style="filter: invert(1);">
                        </button>
                        <input type="text" id="new-category-name" class="form-control border-0 bg-transparent text-muted small"
                            placeholder="Add Category..." aria-label="Add Category">
                    </div>
                </div>
            

                <div class="col-md-8 col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h3 class="fw-bold mb-0" id="current-category-title">Select a Category</h3>
            

                        <div class="input-group shadow-sm rounded-pill bg-white border px-2 py-1" style="max-width: 70px;">
                            <button class="btn btn-warning text-white rounded-pill px-3 d-inline-flex align-items-center gap-1" onclick="triggerAddProductPlaceholder()" style="max-width: 70px;">
                                <img src="/static/admin/bootstrap/plus.svg" width="16" height="16" style="filter: invert(1);">
                            </button>
                        </div>
                    </div>
            

                    <div class="card border-0 shadow-sm rounded-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-start">
                                <thead class="table-light border-bottom">
                                    <tr class="text-muted small">
                                        <th scope="col" class="py-3 ps-4" style="width: 40%;">Item Name</th>
                                        <th scope="col" class="py-3" style="width: 30%;">Price</th>
                                        <th scope="col" class="py-3 pe-4 text-end" style="width: 30%;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="products-table-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            
            </div>


        </div>



        <div class="modal fade" id="editItemModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="editItemModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
                <div class="modal-content border-0 shadow px-3 py-2" style="border-radius: 16px;">
                    <div class="modal-body">
                        <h4 class="fw-bold mb-4 text-dark" id="editItemModalLabel">Edit Item</h4>
                    
                        <form id="edit-item-form">
                            <input type="hidden" id="edit-product-id">
                    
                            <div class="mb-3">
                                <label for="edit-item-name" class="form-label text-muted fw-semibold small mb-1">Item Name</label>
                                <input type="text" class="form-control bg-light border px-3 py-2" id="edit-item-name"
                                    style="border-radius: 8px;" required>
                            </div>
                    
                            <div class="mb-3">
                                <label for="edit-item-price" class="form-label text-muted fw-semibold small mb-1">Price</label>
                                <input type="number" step="0.01" class="form-control bg-light border px-3 py-2" id="edit-item-price"
                                    style="border-radius: 8px;" required>
                            </div>
                    
                            <div id="combo-items-section" class="mb-3 d-none">
                                <label class="form-label text-muted fw-semibold small mb-1">Combo Contents</label>
                    
                                <div class="d-flex gap-2 mb-2">
                                    <select id="combo-product-select" class="form-select form-select-sm bg-light border-0 py-2"
                                        style="border-radius: 8px; font-size: 0.85rem;">
                                        <option value="">Select an item...</option>
                                    </select>
                                    <input type="number" id="combo-quantity-input"
                                        class="form-control form-select-sm bg-light border-0 py-2 text-center" value="1" min="1"
                                        style="width: 65px; border-radius: 8px; font-size: 0.85rem;">
                                    <button type="button" class="btn btn-sm text-white fw-bold px-3"
                                        style="background-color: #ff9800; border-radius: 8px; font-size: 0.85rem;"
                                        onclick="addItemToComboList()">Add</button>
                                </div>
                    
                                <div class="border rounded p-2 bg-light" style="max-height: 150px; overflow-y: auto; border-radius: 8px;">
                                    <ul class="list-group list-group-flush small" id="combo-items-list"></ul>
                                </div>
                            </div>
                    
                            <div class="mb-4">
                                <label class="form-label text-muted fw-semibold small mb-1">Product Image</label>
                    
                                <div id="image-drop-zone"
                                    class="border border-2 border-dashed d-flex flex-column align-items-center justify-content-center p-3 text-center bg-light mb-2"
                                    style="border-radius: 8px; cursor: pointer; min-height: 120px;">
                                    <i class="bi bi-cloud-arrow-up fs-2 text-muted mb-1"></i>
                                    <p class="small text-muted mb-0" id="drop-zone-text">Drag & drop an image here or click to browse</p>
                                    <input type="file" id="edit-item-image" accept="image/*" class="d-none">
                                </div>
                    
                                <div id="image-preview-container" class="d-none position-relative text-center border p-1 bg-white"
                                    style="border-radius: 8px;">
                                    <img id="edit-image-preview" src="" alt="Preview" class="img-fluid rounded"
                                        style="max-height: 140px; object-fit: contain;">
                                    <button type="button" id="remove-preview-btn"
                                        class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle"
                                        style="padding: 2px 8px;">&times;</button>
                                </div>
                            </div>
                    
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn text-white fw-bold w-50 py-2.5 border-0"
                                    style="background-color: #ff9800; border-radius: 8px;">Save</button>
                                <button type="button" class="btn btn-secondary text-dark fw-bold w-50 py-2.5 border-0"
                                    data-bs-dismiss="modal" style="background-color: #dbdbdb; border-radius: 8px;">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>















    </main>

    <script src="/static/admin/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin/menu.js"></script>
    <script src="/static/admin/shared.js"></script>
    <script>
        addEventListener("DOMContentLoaded", (event) => { authenticate() })
        addEventListener("DOMContentLoaded", (event) => { loadCategories() })
        addEventListener("DOMContentLoaded", (event) => { setSidebarUserInfo() })
    </script>
</body>

</html>
