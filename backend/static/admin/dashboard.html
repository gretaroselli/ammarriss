<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Amarri's Kitchen</title>
    <link href="/static/admin/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <div class="position-fixed top-0 start-0 bottom-0 d-flex flex-column align-items-center pt-4 px-3 text-white"
        style="width: 260px; background-color: #110d26; z-index: 1030;">

        <ul class="nav flex-column text-center w-100">
            <img src="/static/images/logo_ak.jpg" alt="Amarri's Kitchen Logo" class="rounded-circle d-block mx-auto mb-2"
                style="width: 80px; height: 80px; object-fit: cover; border: 2px solid #ffffff;">
            <h6 class="mt-2 mb-4 text-white fw-bold">Amarri's Kitchen</h6>

            <li class="nav-item mb-2">
                <a class="nav-link bg-warning text-white fw-bold rounded-pill py-2 px-3 shadow-sm"
                    href="/static/admin/dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/orders.html">Orders</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/reports.html">Report</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/transactions.html">Transaction
                    History</a>
            </li>
            <li class="nav-item mb-2">
                <a class="nav-link text-white-50 rounded-pill py-2 px-3 link-light" href="/static/admin/menu.html">Menu Management</a>
            </li>
        </ul>

        <div class="mt-auto w-100 mb-4">
            <hr class="text-white-50 my-4">
            <div class="card border-0 text-white mb-3 bg-white bg-opacity-10">
                <div class="card-body p-3">
                    <h5 class="card-title mb-1 fw-bold" id="user-name"></h5>
                    <p class="card-text small mb-1 text-white-50" id="user-role"></p>
                </div>
            </div>
            <a class="btn btn-outline-light w-100 border-white border-opacity-25 py-2" href="#" role="button" onclick="handleSignOut()">Sign
                Out</a>
        </div>
    </div>


    <main style="margin-left: 260px;">
        <div class="container-fluid py-4 px-4 min-vh-100 bg-light">

            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h1 class="fw-bold mb-1">Dashboard</h1>
            
                </div>
                <span class="btn btn-sm bg-white text-dark border p-2 shadow-sm fs-6 fw-normal rounded-pill" onclick="window.location.reload()">Reload</span>
            </div>

            <div class="row g-4 mb-4">

                <div class="col-12 col-md-4">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fs-7 fw-bold mb-2">Total Sales</h6>
                            <h2 class="fw-extrabold mb-0" id="stat-total-sales">0</h2>
                            <small class="text-muted fw-semibold">Today</small>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fs-7 fw-bold mb-2">Orders</h6>
                            <h2 class="fw-extrabold mb-0 text-warning" id="stat-orders-today">0</h2>
                            <small class="text-muted">Today</small>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <div class="card-body">
                            <h6 class="text-muted text-uppercase fs-7 fw-bold mb-2">Pending</h6>
                            <h2 class="fw-extrabold mb-0" id="stat-pending-today">0</h2>
                            <small class="text-muted fw-semibold">Today</small>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <div class="card-body">
                            <h6 class="text-success text-uppercase fs-7 fw-bold mb-2">Completed</h6>
                            <h2 class="fw-extrabold mb-0" id="stat-completed-today">0</h2>
                            <small class="text-muted fw-semibold">Today</small>
                        </div>
                    </div>
                </div>

            </div>
            <div class="row g-4">

                <div class="w-100">
                    <div class="card border-0 shadow-sm h-100">
                        <div
                            class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                            <h5 class="fw-bold mb-0">Recent Orders</h5>
                            <a href="orders.html"
                                class="btn btn-sm btn-link text-warning text-decoration-none fw-bold">View All Orders
                                →</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">Order ID</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                        <th class="text-end pe-3">Total</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-orders-rows">
                                    <tr>
                                        <td class="ps-3 fw-bold"></td>
                                        <td>Dine In</td>
                                        <td><span class="badge text-dark rounded-pill px-2"></span>
                                        </td>
                                        <td class="text-end pe-3 fw-bold"></td>
                                    </tr>
                                    <tr>
                                        <td class="ps-3 fw-bold"></td>
                                        <td>Take-Out</td>
                                        <td><span class="badge text-dark rounded-pill px-2"></span></td>
                                        <td class="text-end pe-3 fw-bold"></td>
                                    </tr>
                                    <tr>
                                        <td class="ps-3 fw-bold"></td>
                                        <td>Dine In</td>
                                        <td><span class="badge text-dark rounded-pill px-2"></span></td>
                                        <td class="text-end pe-3 fw-bold"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            
            </div>
        </div>
    </main>

    <script src="/static/admin/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin/dashboard.js"></script>
    <script src="/static/admin/shared.js"></script>
    <script>
        addEventListener("DOMContentLoaded", (event) => { setSidebarUserInfo() })
        addEventListener("DOMContentLoaded", (event) => { updateDashboardStats()})
        
    </script>
</body>

</html>
